services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: rentals}
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d rentals"]
      interval: 5s
      timeout: 5s
      retries: 10
  seed:
    build: .
    command: ["python", "-m", "app.seed"]
    environment: {DATABASE_URL: postgresql://portfolio:portfolio@db:5432/rentals}
    depends_on:
      db: {condition: service_healthy}
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    working_dir: /workspace
    volumes: ["./dbt:/workspace"]
    command: ["build", "--profiles-dir", "."]
    depends_on:
      seed: {condition: service_completed_successfully}
  metabase:
    image: metabase/metabase:v0.52.4
    ports: ["3000:3000"]
    depends_on: [db]
